        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    SessionCookie: { type: apiKey, in: cookie, name: stocksense_session }
    TelegramWebhookSecret: { type: apiKey, in: header, name: X-Telegram-Bot-Api-Secret-Token }
  parameters:
    Symbol: { in: path, name: symbol, required: true, schema: { type: string, pattern: '^[A-Z0-9.-]{1,12}$' } }
  responses:
    Unauthorized:
      description: Missing or expired session
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Forbidden:
      description: Authenticated user lacks capability
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    NotFound:
      description: Resource not found
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    InvalidRequest:
      description: Invalid request payload
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Conflict:
      description: Account state conflict or duplicate email
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    ServiceUnavailable:
      description: Market batch is not available yet
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  schemas:
    NotificationPreferencesInput:
      type: object
      required: [in_app_enabled, email_enabled, telegram_enabled]
      additionalProperties: false
      properties:
        in_app_enabled: { type: boolean }
        email_enabled: { type: boolean }
        telegram_enabled: { type: boolean }
    ChatSessionInput:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 120, default: 'Cuộc trò chuyện mới' }
    ChatMessageInput:
      type: object
      required: [content]
      additionalProperties: false
      properties:
        content: { type: string, minLength: 1, maxLength: 8000 }
    InvestmentProfileInput:
      type: object
      required: [capital_vnd, risk_pct]
      additionalProperties: false
      properties:
        capital_vnd: { type: number, exclusiveMinimum: 0, maximum: 1000000000000000 }
        risk_pct: { type: number, exclusiveMinimum: 0, maximum: 100 }
    InvestmentProfile:
      allOf:
        - $ref: '#/components/schemas/InvestmentProfileInput'
        - type: object
          required: [updated_at]
          properties:
            updated_at: { type: string, format: date-time }
    PortfolioTransactionInput:
      type: object
      required: [symbol, side, quantity, unit_price, executed_at]
      properties:
        symbol: { type: string, pattern: '^[A-Z0-9.-]{1,12}$' }
        side: { type: string, enum: [buy, sell] }
        quantity: { type: number, exclusiveMinimum: 0 }
        unit_price: { type: number, exclusiveMinimum: 0 }
        fee: { type: number, minimum: 0, default: 0 }
        executed_at: { type: string, format: date }
        note: { type: string, maxLength: 500 }
    PlanCalculationInput:
      type: object
      required: [side, entry_price, stop_price, target_price]
      properties:
        side: { type: string, enum: [long, short] }
        entry_price: { type: number, exclusiveMinimum: 0 }
        stop_price: { type: number, exclusiveMinimum: 0 }
        target_price: { type: number, exclusiveMinimum: 0 }
        capital_vnd: { type: number, exclusiveMinimum: 0 }
        risk_pct: { type: number, exclusiveMinimum: 0, maximum: 100 }
    TradePlanInput:
      allOf:
        - $ref: '#/components/schemas/PlanCalculationInput'
        - type: object
          required: [symbol]
          properties:
            symbol: { type: string, pattern: '^[A-Z0-9.-]{1,12}$' }
            status: { type: string, enum: [draft, planned], default: planned }
            entry_price_max: { type: number, exclusiveMinimum: 0, description: Upper bound of the entry zone (entry_price is the lower bound) }
            quantity: { type: number, exclusiveMinimum: 0 }
            expires_on: { type: string, format: date }
            note: { type: string, maxLength: 1000 }
    JournalUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        body: { type: string, maxLength: 4000 }
        tags: { type: array, maxItems: 10, items: { type: string, minLength: 1, maxLength: 24 } }
        lesson: { type: string, maxLength: 3000 }
    TradePlanUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        entry_price: { type: number, exclusiveMinimum: 0 }
        entry_price_max: { type: [number, 'null'], exclusiveMinimum: 0 }
        stop_price: { type: number, exclusiveMinimum: 0 }
        target_price: { type: number, exclusiveMinimum: 0 }
        quantity: { type: [number, 'null'], exclusiveMinimum: 0 }
        note: { type: string, maxLength: 1000 }
        expires_on: { type: [string, 'null'], format: date }
    ManualJournalInput:
      type: object
      required: [symbol, title]
      additionalProperties: false
      properties:
        symbol: { type: string, pattern: '^[A-Z0-9.-]{1,12}$' }
        title: { type: string, minLength: 1, maxLength: 160 }
        body: { type: string, maxLength: 4000 }
        tags: { type: array, maxItems: 10, items: { type: string, minLength: 1, maxLength: 24 } }
        lesson: { type: string, maxLength: 3000 }
    UserEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [user]
          properties:
            user: { $ref: '#/components/schemas/User' }
    User:
      type: object
      required: [id, email, role, must_change_password]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [retail, trader, analyst, admin] }
        must_change_password: { type: boolean }
    Forecast:
      type: object
      required: [label, probabilities, confidence]
      properties:
        label: { type: string, enum: [up, hold, down] }
        probabilities:
          type: object
          required: [up, hold, down]
          properties:
            up: { type: number, minimum: 0, maximum: 1 }
            hold: { type: number, minimum: 0, maximum: 1 }
            down: { type: number, minimum: 0, maximum: 1 }
        confidence: { type: string, enum: [low, mid, high] }
    Symbol:
      type: object
      required: [symbol, name, exchange, closePrice, changePercent, averageTurnover20d, dataStatus, forecasts]
      properties:
        symbol: { type: string }
        name: { type: string }
        exchange: { type: string, enum: [HOSE, HNX, UPCOM] }
        closePrice: { type: number }
        priceDate: { type: [string, 'null'], format: date }
        priceDataStatus: { type: string, enum: [live, demo, unavailable] }
        changePercent: { type: number }
        averageTurnover20d: { type: number }
        dataStatus: { type: string }
        forecasts:
          type: object
          required: [t2, t5]
          properties:
            t2: { $ref: '#/components/schemas/Forecast' }
            t5: { $ref: '#/components/schemas/Forecast' }
    SymbolList:
      type: object
      required: [total, items]
      properties:
        total: { type: integer }
        items: { type: array, items: { $ref: '#/components/schemas/Symbol' } }
    MarketStatus:
      type: object
      required: [dataDate, batchCompletedAt, modelVersion, state, sourceStatus]
      properties:
        dataDate: { type: string, format: date }
        batchCompletedAt: { type: string, format: date-time }
        modelVersion: { type: string }
        state: { type: string }
        sourceStatus: { type: string }
    MarketSummary:
      type: object
      required: [indices, breadth, labelDistribution]
      properties:
        indices: { type: array, items: { type: object, required: [code, label, value, changePoints, changePercent], properties: { code: { type: string }, label: { type: string }, value: { type: number }, changePoints: { type: number }, changePercent: { type: number } } } }
        breadth: { type: object, required: [advances, nochanges, declines], properties: { advances: { type: integer }, nochanges: { type: integer }, declines: { type: integer } } }
        labelDistribution: { type: object, required: [up, hold, down], properties: { up: { type: integer }, hold: { type: integer }, down: { type: integer } } }
    PriceSeries:
      type: object
      required: [symbol, currency, interval, sourceStatus, latestDate, items]
      properties:
        symbol: { type: string }
        currency: { type: string, const: VND }
        interval: { type: string, const: 1d }
        sourceStatus: { type: string, enum: [live, demo, mixed] }
        latestDate: { type: string, format: date }
        items: { type: array, items: { type: object, required: [date, close], properties: { date: { type: string, format: date }, close: { type: number } } } }
    NewsList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { type: object, required: [id, title, summary, source, publishedAt, sentiment, url], properties: { id: { type: string }, title: { type: string }, summary: { type: string }, source: { type: string }, publishedAt: { type: string, format: date-time }, sentiment: { type: string, enum: [positive, neutral, negative] }, url: { type: [string, 'null'], format: uri } } } }
    AdminJobsResult:
      type: object
      required: [jobs, runs, workers]
      properties:
        jobs: { type: array, items: { type: object, required: [key, label, description], properties: { key: { type: string, enum: [market.sync, news.sync, notifications.deliver] }, label: { type: string }, description: { type: string } } } }
        runs: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/AdminJobRun' } }
        workers: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/AdminWorkerInstance' } }
    AdminJobRun:
      type: object
      required: [id, job_key, status, attempt_count, queued_at, started_at, finished_at, error_code]
      properties:
        id: { type: string, format: uuid }
        job_key: { type: string, enum: [market.sync, news.sync, notifications.deliver] }
        status: { type: string, enum: [queued, running, succeeded, partial, failed] }
        attempt_count: { type: integer }
        queued_at: { type: string, format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        error_code: { type: [string, 'null'] }
    AdminWorkerInstance:
      type: object
      required: [worker_id, mode, started_at, heartbeat_at, active_job_key, stopped_at, online]
      properties:
        worker_id: { type: string, format: uuid }
        mode: { type: string, enum: [once, watch] }
        started_at: { type: string, format: date-time }
        heartbeat_at: { type: string, format: date-time }
        active_job_key: { type: [string, 'null'] }
        stopped_at: { type: [string, 'null'], format: date-time }
        online: { type: boolean }
    AdminNotificationLog:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, channel, status, attempt_count, next_attempt_at, sent_at, last_error_code, created_at]
            properties:
              id: { type: string, format: uuid }
              channel: { type: string, enum: [email, telegram] }
              status: { type: string, enum: [pending, processing, sent, skipped, failed] }
              attempt_count: { type: integer }
              next_attempt_at: { type: string, format: date-time }
              sent_at: { type: [string, 'null'], format: date-time }
              last_error_code: { type: [string, 'null'] }
              created_at: { type: string, format: date-time }
    AdminOpsEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            type: object
            required: [event_id, event_type, severity, source, status, reference_id, error_code, occurred_at, context]
            properties:
              event_id: { type: string }
              event_type: { type: string }
              severity: { type: string, enum: [warning, error] }
              source: { type: string }
              status: { type: string }
              reference_id: { type: string }
              error_code: { type: string }
              occurred_at: { type: string, format: date-time }
              context: { type: object, additionalProperties: true }
    AdminUser:
      type: object
      required: [id, email, role, is_active, must_change_password, failed_login_count, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [retail, trader, analyst, admin] }
        is_active: { type: boolean }
        must_change_password: { type: boolean }
        failed_login_count: { type: integer }
        locked_until: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
    AdminUserList:
      type: object
      required: [total, items]
      properties:
        total: { type: integer }
        items: { type: array, items: { $ref: '#/components/schemas/AdminUser' } }
    AdminUserUpdateResult:
      type: object
      properties:
        user: { $ref: '#/components/schemas/AdminUser' }
        revoked_sessions: { type: integer }
    TemporaryPasswordResult:
      type: object
      properties:
        user: { $ref: '#/components/schemas/AdminUser' }
        temporary_password: { type: string, writeOnly: true }
        revoked_sessions: { type: integer }
    AdminAuditList:
      type: object
      required: [items, next_cursor]
      properties:
        next_cursor: { type: [string, 'null'], maxLength: 256 }
        items:
          type: array
          items:
            type: object
            required: [id, event_type, details, created_at]
            properties:
              id: { type: string }
              event_type: { type: string }
              details: { type: object }
              actor_email: { type: [string, 'null'], format: email }
              target_email: { type: [string, 'null'], format: email }
              created_at: { type: string, format: date-time }
    IngestionRunList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, source, dataset, status, range_start, range_end, units_label, symbols_total, symbols_succeeded, rows_upserted, started_at]
            properties:
              id: { type: string }
              source: { type: string }
              dataset: { type: string }
              status: { type: string, enum: [running, succeeded, partial, failed] }
              range_start: { type: string, format: date }
              range_end: { type: string, format: date }
              units_label: { type: string, enum: [symbols, categories] }
              symbols_total: { type: integer }
              symbols_succeeded: { type: integer }
              rows_upserted: { type: integer }
              error_message: { type: [string, 'null'] }
              started_at: { type: string, format: date-time }
              completed_at: { type: [string, 'null'], format: date-time }
    Watchlist:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 10
          items:
            type: object
            required: [symbol, name, exchange, note, created_at, updated_at]
            properties:
              symbol: { type: string }
              name: { type: string }
              exchange: { type: string, enum: [HOSE, HNX, UPCOM] }
              note: { type: string, maxLength: 500 }
              close: { type: [number, 'null'] }
              price_date: { type: [string, 'null'], format: date }
              created_at: { type: string, format: date-time }
              updated_at: { type: string, format: date-time }
    AlertRuleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, symbol, condition, target_price, is_active, created_at]
            properties:
              id: { type: string, format: uuid }
              symbol: { type: string }
              name: { type: string }
              condition: { type: string, enum: [price_above, price_below] }
              target_price: { type: number }
              is_active: { type: boolean }
              created_at: { type: string, format: date-time }
    UserAlertList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, symbol, alert_type, title, message, trade_date, created_at]
            properties:
              id: { type: string, format: uuid }
              symbol: { type: string }
              name: { type: string }
              alert_type: { type: string, enum: [price_crossed_above, price_crossed_below] }
              title: { type: string }
              message: { type: string }
              payload: { type: object }
              read_at: { type: [string, 'null'], format: date-time }
              trade_date: { type: string, format: date }
              created_at: { type: string, format: date-time }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string }
            message: { type: string }
            fields: { type: [object, 'null'] }
            request_id: { type: string }
