openapi: 3.1.0
info:
  title: StockSense VN API
  version: 0.1.0
  description: Contract for the first web slice. PostgreSQL mode stores demo market content and database sessions; fixture mode uses development-only accounts.
servers:
  - url: /api/v1
tags:
  - name: Auth
  - name: Market
  - name: Symbols
  - name: Admin
  - name: Personal
  - name: Screener
  - name: Portfolio
  - name: Plans
  - name: Journal
  - name: Reports
  - name: Settings
  - name: Chat
paths:
  /auth/forgot-password:
    post:
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        '202': { description: Generic response independent of whether the account exists }
        '422': { $ref: '#/components/responses/InvalidRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /auth/reset-password:
    post:
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: { type: string, minLength: 40, maxLength: 64 }
                new_password: { type: string, minLength: 12, maxLength: 128 }
      responses:
        '200': { description: Password updated, outstanding tokens consumed, and sessions revoked }
        '422': { description: Invalid, expired, or already used token; or invalid password }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /admin/jobs:
    get:
      tags: [Admin]
      x-required-capability: admin.jobs.read
      security: [{ SessionCookie: [] }]
      responses:
        '200':
          description: Allowlisted worker jobs, 50 recent runs, and the 10 most recently seen worker instances with online state
          content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/AdminJobsResult' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /admin/jobs/{job}/run:
    post:
      tags: [Admin]
      x-required-capability: admin.jobs.enqueue
      security: [{ SessionCookie: [] }]
      parameters:
        - { name: job, in: path, required: true, schema: { type: string, enum: [market.sync, news.sync, notifications.deliver] } }
      responses:
        '202': { description: Worker job accepted into queue; request does not run the job }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Another run of this job is queued or running }
        '404': { description: Job key is not allowlisted }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /admin/notifications:
    get:
      tags: [Admin]
      x-required-capability: admin.notifications.read
      security: [{ SessionCookie: [] }]
      parameters:
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: Recent notification delivery metadata without recipients or alert contents, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/AdminNotificationLog' } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /admin/ops-events:
    get:
      tags: [Admin]
      x-required-capability: admin.ops-events.read
      security: [{ SessionCookie: [] }]
      parameters:
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: Recent failed or partial operational runs, with no raw error messages or user-owned data, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/AdminOpsEventList' } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /reports/symbols/{symbol}.pdf:
    get:
      tags: [Reports]
      x-required-capability: reports.symbol.export
      security: [{ SessionCookie: [] }]
      parameters:
        - { name: symbol, in: path, required: true, schema: { type: string, pattern: '^[A-Z0-9.-]{1,12}$' } }
      responses:
        '200': { description: Symbol PDF report, content: { application/pdf: { schema: { type: string, format: binary } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /reports/portfolio.pdf:
    get:
      tags: [Reports]
      x-required-capability: reports.portfolio.export.self
      x-owner-scope: session.user_id
      security: [{ SessionCookie: [] }]
      responses:
        '200': { description: Current user's portfolio PDF, content: { application/pdf: { schema: { type: string, format: binary } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /reports/plans/{id}.pdf:
    get:
      tags: [Reports]
      x-required-capability: reports.plan.export.self
      x-owner-scope: session.user_id
      security: [{ SessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Current user's trade plan PDF, content: { application/pdf: { schema: { type: string, format: binary } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Plan not found or not owned by current user }
  /reports/journal.pdf:
    get:
      tags: [Reports]
      x-required-capability: reports.journal.export.self
      x-owner-scope: session.user_id
      security: [{ SessionCookie: [] }]
      responses:
        '200': { description: Current user's journal PDF, content: { application/pdf: { schema: { type: string, format: binary } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /symbols/{symbol}/history.csv:
    get:
      tags: [Symbols]
      x-required-capability: history.csv.export
      x-release-flag: HISTORY_CSV_EXPORT_ENABLED
      security: [{ SessionCookie: [] }]
      parameters:
        - { name: symbol, in: path, required: true, schema: { type: string, pattern: '^[A-Z0-9.-]{1,12}$' } }
        - { name: range, in: query, schema: { type: string, enum: [1m, 3m, 6m], default: 6m } }
      responses:
        '200': { description: Daily closing price CSV, content: { text/csv: { schema: { type: string } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Feature disabled or history not found }
  /chat/sessions:
    get:
      tags: [Chat]
      x-required-capability: chat.use.self
      security: [{ SessionCookie: [] }]
      responses:
        '200': { description: Chat sessions owned by the current user }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [Chat]
      x-required-capability: chat.use.self
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatSessionInput' }
      responses:
        '201': { description: Created private chat session }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /chat/sessions/{sessionId}/messages:
    parameters:
      - { in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Chat]
      x-required-capability: chat.use.self
      security: [{ SessionCookie: [] }]
      parameters:
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
      responses:
        '200': { description: Messages belonging to the current user's session }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [Chat]
      x-required-capability: chat.use.self
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatMessageInput' }
      responses:
        '201': { description: User message and generated answer, once inference and safety are configured }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
        '503': { description: Model or safety pipeline unavailable; request is not stored, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /chat/sessions/{sessionId}:
    parameters:
      - { in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Chat]
      x-required-capability: chat.use.self
      security: [{ SessionCookie: [] }]
      responses:
        '200': { description: Deleted the current user's session and messages }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /journal:
    get:
      tags: [Journal]
      x-required-capability: journal.read.self
      security: [{ SessionCookie: [] }]
      parameters:
        - { in: query, name: symbol, schema: { type: string, maxLength: 12 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { in: query, name: from, description: Decision date (manual) or creation date, ICT, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
        - { in: query, name: tag, schema: { type: string, maxLength: 24 } }
        - { in: query, name: result, schema: { type: string, enum: [win, loss, breakeven, none] } }
        - { in: query, name: q, description: Case-insensitive search in title, note and lesson, schema: { type: string, maxLength: 100 } }
      responses:
        '200': { description: Journal entries owned by the current user; snapshots and outcomes are read-only }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Journal]
      x-required-capability: journal.manual.create.self
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManualJournalInput' }
      responses:
        '201': { description: Manually created private journal entry }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /journal/stats:
    get:
      tags: [Journal]
      x-required-capability: journal.stats.read.self
      security: [{ SessionCookie: [] }]
      parameters:
        - { in: query, name: period, schema: { type: string, enum: [week, month, quarter], default: month } }
      responses:
        '200': { description: Owner-scoped totals plus per-period buckets (closed plans, target/stop hit rate, planned and realized R, P/L) }
        '403': { $ref: '#/components/responses/Forbidden' }
  /journal/{id}:
    patch:
      tags: [Journal]
      x-required-capability: journal.update.self
      security: [{ SessionCookie: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JournalUpdate' }
      responses:
        '200': { description: Updated owner note, tags, or lesson; snapshot and result unchanged }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /plans/calc:
    post:
      tags: [Plans]
      x-required-capability: plans.calculate.rr
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanCalculationInput' }
      responses:
        '200': { description: Risk, reward, and R:R; quantity fields are role-gated }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /plans:
    get:
      tags: [Plans]
      x-required-capability: plans.manage.self
      security: [{ SessionCookie: [] }]
      responses:
        '200': { description: Trade plans owned by the current user }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Plans]
      x-required-capability: plans.manage.self
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TradePlanInput' }
      responses:
        '201': { description: Created plan with immutable market snapshot }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /plans/{id}:
    patch:
      tags: [Plans]
      x-required-capability: plans.manage.self
      security: [{ SessionCookie: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { type: object, required: [status], additionalProperties: false, properties: { status: { type: string, enum: [planned, active, cancelled] } } }
                - $ref: '#/components/schemas/TradePlanUpdate'
      responses:
        '200': { description: Updated plan (status transition draft→planned→active, or an edit recorded in revisions) }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidRequest' }
  /plans/{id}/close:
    post:
      tags: [Plans]
      x-required-capability: plans.manage.self
      security: [{ SessionCookie: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [exit_price], properties: { exit_price: { type: number, exclusiveMinimum: 0 }, note: { type: string, maxLength: 1000 }, reason: { type: string, enum: [target_hit, stop_hit, expired, manual], default: manual } } }
      responses:
        '200': { description: Closed plan; Journal entry created in the same transaction }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidRequest' }
  /portfolio:
    get:
      tags: [Portfolio]
      x-required-capability: portfolio.manage.self
      security: [{ SessionCookie: [] }]
      responses:
        '200': { description: User-scoped portfolio summary, positions with industry and weight, allocation by symbol/industry, 180-day value history, and ledger }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      tags: [Portfolio]
      x-required-capability: portfolio.manage.self
      security: [{ SessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [confirm], properties: { confirm: { type: string, const: 'XOA TOAN BO' } } } } } }
      responses:
        '200': { description: All portfolio transactions of the current user deleted }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /portfolio/transactions:
    post:
      tags: [Portfolio]
      x-required-capability: portfolio.manage.self
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PortfolioTransactionInput' }
      responses:
        '201': { description: Transaction recorded and portfolio recalculated }
        '409': { $ref: '#/components/responses/InvalidRequest' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /portfolio/transactions/import:
    post:
      tags: [Portfolio]
      x-required-capability: portfolio.import.self
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transactions]
              properties:
                transactions:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { $ref: '#/components/schemas/PortfolioTransactionInput' }
      responses:
        '200': { description: All transactions recorded atomically }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /portfolio/transactions/{id}:
    patch:
      tags: [Portfolio]
      x-required-capability: portfolio.manage.self
      security: [{ SessionCookie: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PortfolioTransactionInput' } } } }
      responses:
        '200': { description: Transaction updated and portfolio recalculated }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidRequest' }
    delete:
      tags: [Portfolio]
      x-required-capability: portfolio.manage.self
      security: [{ SessionCookie: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Transaction removed and portfolio recalculated }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidRequest' }
  /screener:
    get:
      tags: [Screener]
      summary: Filter enabled symbols using market prices and turnover
      x-required-capability: screener.read
      security: [{ SessionCookie: [] }]
      parameters:
        - { in: query, name: exchange, schema: { type: string, enum: [HOSE, HNX, UPCOM] } }
        - { in: query, name: minPrice, schema: { type: number, minimum: 0 } }
        - { in: query, name: maxPrice, schema: { type: number, minimum: 0 } }
        - { in: query, name: minChange, schema: { type: number } }
        - { in: query, name: maxChange, schema: { type: number } }
        - { in: query, name: minTurnover, schema: { type: number, minimum: 0 } }
      responses:
        '200': { description: Matching symbols and market metrics }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    
  /screener/saved-filters:
    get:
      tags: [Screener]
      x-required-capability: screener.saved.manage.self
      security: [{ SessionCookie: [] }]
      responses:
        '200': { description: Saved filters owned by the current user }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [Screener]
      x-required-capability: screener.saved.manage.self
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, filters]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                filters: { type: object }
      responses:
        '200': { description: Saved or updated filter }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /screener/saved-filters/{id}:
    delete:
      tags: [Screener]
      x-required-capability: screener.saved.manage.self
      security: [{ SessionCookie: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Saved filter deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /auth/login:
    post:
      tags: [Auth]
      summary: Create a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 1, maxLength: 256, writeOnly: true }
      responses:
        '200':
          description: Authenticated user; session is set in an HttpOnly cookie
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /auth/logout:
    post:
      tags: [Auth]
      security: [{ SessionCookie: [] }]
      responses:
        '204': { description: Session cleared }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/change-password:
    post:
      tags: [Auth]
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string, minLength: 1, maxLength: 256, writeOnly: true }
                new_password: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
      responses:
        '200': { description: Password changed and other sessions revoked, content: { application/json: { schema: { $ref: '#/components/schemas/UserEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
  /me:
    get:
      tags: [Auth]
      security: [{ SessionCookie: [] }]
      responses:
        '200': { description: Current user, content: { application/json: { schema: { $ref: '#/components/schemas/UserEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/profile:
    get:
      tags: [Settings]
      x-required-capability: profile.investment.manage.self
      security: [{ SessionCookie: [] }]
      responses:
        '200': { description: Personal investment profile, possibly null when not configured, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: object, required: [profile], properties: { profile: { oneOf: [{ $ref: '#/components/schemas/InvestmentProfile' }, { type: 'null' }] } } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    put:
      tags: [Settings]
      x-required-capability: profile.investment.manage.self
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvestmentProfileInput' }
      responses:
        '200': { description: Saved personal investment profile, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: object, required: [profile], properties: { profile: { $ref: '#/components/schemas/InvestmentProfile' } } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /me/notification-preferences:
    get:
      tags: [Settings]
      x-required-capability: notifications.channels.manage.self
      security: [{ SessionCookie: [] }]
      responses:
        '200': { description: Current user's channel preferences and provider readiness; readiness does not imply delivery }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    put:
      tags: [Settings]
      x-required-capability: notifications.channels.manage.self
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
