<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>StockSense VN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: app shell — sidebar điều hướng + thanh trạng thái dữ liệu trên cùng; dưới 760px chuyển thành tab bar đáy như bản mobile (SDD 8.3) */
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --surface-2:#ECEFEA; --ink:#15201B; --muted:#5A6660; --line:#DADFD8;
  --accent:#0B5D52; --accent-ink:#FFFFFF; --accent-soft:#DDEDE8;
  --up:#0B8445; --up-soft:#DDF1E5; --hold:#A86B0C; --hold-soft:#FAEFD6; --down:#C9352A; --down-soft:#FBE3E0;
  --warn:#A86B0C; --info:#1F6FA8; --info-soft:#E0EDF7;
  --shadow:0 1px 2px rgba(18,32,27,.06),0 4px 16px rgba(18,32,27,.05);
  --f-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r-sm:6px; --r-md:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#151D1A; --surface-2:#1C2622; --ink:#E4EBE7; --muted:#9AA8A1; --line:#28342F;
  --accent:#4CC2A6; --accent-ink:#0B1714; --accent-soft:#183A33;
  --up:#3ECB7F; --up-soft:#173527; --hold:#E3AE48; --hold-soft:#3A2E15; --down:#FF6E61; --down-soft:#3E1D1A;
  --warn:#E3AE48; --info:#6DB5EA; --info-soft:#17303F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#151D1A; --surface-2:#1C2622; --ink:#E4EBE7; --muted:#9AA8A1; --line:#28342F;
  --accent:#4CC2A6; --accent-ink:#0B1714; --accent-soft:#183A33;
  --up:#3ECB7F; --up-soft:#173527; --hold:#E3AE48; --hold-soft:#3A2E15; --down:#FF6E61; --down-soft:#3E1D1A;
  --warn:#E3AE48; --info:#6DB5EA; --info-soft:#17303F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
h2{font-size:16px;font-weight:600}
h3{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
p{margin:0}

/* shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:13px}
.brand b{font-size:15px;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:11px}
.navgrp{display:flex;flex-direction:column;gap:2px}
.navgrp h3{font-size:10.5px;padding:0 10px 4px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);border:0;background:none;text-align:left;cursor:pointer;color:var(--ink);font-weight:500;width:100%}
.nav svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;color:var(--muted)}
.nav:hover{background:var(--surface-2)}
.nav.on{background:var(--accent-soft);color:var(--accent)}
.nav.on svg{color:var(--accent)}
.nav .tag{margin-left:auto}
.tag{font-size:10px;font-weight:600;padding:1px 6px;border-radius:99px;background:var(--surface-2);color:var(--muted);letter-spacing:.03em;white-space:nowrap}
.side-foot{margin-top:auto;padding:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--muted)}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.datastat{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);min-width:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--up);flex:none;box-shadow:0 0 0 3px var(--up-soft)}
.top .grow{flex:1}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 10px;min-width:200px}
.search svg{width:16px;height:16px;flex:none;stroke:var(--muted);fill:none;stroke-width:1.8}
.search input{border:0;background:none;outline:none;width:100%}
.iconbtn{position:relative;width:34px;height:34px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7}
.badge{position:absolute;top:-5px;right:-5px;background:var(--down);color:#fff;font-size:10px;font-weight:700;border-radius:99px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
.rolesel{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:12.5px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.content{padding:22px 24px 40px;display:flex;flex-direction:column;gap:18px;max-width:1440px;width:100%}
.pagehead{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;justify-content:space-between}
.pagehead p{color:var(--muted);margin-top:4px;max-width:70ch}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:var(--r-sm);cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--down);border-color:color-mix(in srgb,var(--down) 40%,var(--line))}
.btn.sm{padding:4px 9px;font-size:12px}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.up{background:var(--up-soft);color:var(--up)}
.chip.hold{background:var(--hold-soft);color:var(--hold)}
.chip.down{background:var(--down-soft);color:var(--down)}
.chip.neutral{background:var(--surface-2);color:var(--muted)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.c-up{color:var(--up)} .c-down{color:var(--down)} .c-hold{color:var(--hold)} .muted{color:var(--muted)}
.small{font-size:12px}
.disc{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:var(--r-sm);padding:8px 10px}
.disc svg{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;margin-top:1px}
.note{display:block;padding:10px 12px;border-radius:var(--r-sm);font-size:13px}
.note.warn{background:var(--hold-soft);color:var(--ink)}
.note.warn b{color:var(--hold)}
.note.info{background:var(--info-soft)}
.note .actions{margin-top:8px}
.note.bad{background:var(--down-soft)}
.anno{display:none;font-family:var(--f-num);font-size:10.5px;color:var(--info);background:var(--info-soft);padding:1px 6px;border-radius:4px;white-space:nowrap;font-weight:500}
body.show-anno .anno{display:inline-block}

/* tables */
.tw{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}
.sym{font-weight:700;letter-spacing:.02em}
.sym small{display:block;font-weight:400;color:var(--muted);font-size:11.5px;letter-spacing:0}
.lab{display:inline-flex;align-items:center;gap:5px;font-weight:600}
.flag{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--info);margin-left:4px;vertical-align:middle}

/* market strip */
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)}
.strip>div{padding:14px 16px;border-right:1px solid var(--line);min-width:0}
.strip>div:last-child{border-right:0}
.strip .k{font-size:11.5px;color:var(--muted);font-weight:500}
.strip .v{font-size:20px;font-weight:600;margin-top:2px}
.breadth{display:flex;height:8px;border-radius:99px;overflow:hidden;margin-top:8px;gap:2px}
.breadth i{display:block}

/* forecast card */
.fcs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.fc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.fc-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.hz{font-family:var(--f-num);font-weight:600;font-size:13px;background:var(--surface-2);padding:2px 8px;border-radius:6px}
.fc-label{display:flex;align-items:baseline;gap:10px;font-size:28px;font-weight:700;letter-spacing:-.01em}
.fc-label .pct{font-family:var(--f-num);font-size:18px;font-weight:500;color:var(--muted)}
.pbar{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:2px;background:var(--surface-2)}
.pbar i{display:block;height:100%}
.bg-up{background:var(--up)} .bg-hold{background:var(--hold)} .bg-down{background:var(--down)}
.plegend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px}
.plegend span{display:inline-flex;gap:4px;align-items:center}
.fc-f{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px}
.conf{display:inline-flex;gap:3px;align-items:center}
.conf i{width:6px;height:12px;border-radius:2px;background:var(--line);display:block}
.conf.lv1 i:nth-child(-n+1),.conf.lv2 i:nth-child(-n+2),.conf.lv3 i:nth-child(-n+3){background:var(--accent)}

/* detail */
.dhead{display:flex;gap:18px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.dhead .px{font-size:26px;font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.reasons{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.reasons li{display:grid;grid-template-columns:22px 1fr;gap:8px}
.reasons li b{font-family:var(--f-num);font-size:12px;width:22px;height:22px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center}
.share{display:flex;height:22px;border-radius:6px;overflow:hidden;gap:2px;font-size:11px;font-weight:600}
.share i{display:flex;align-items:center;padding:0 8px;font-style:normal;color:#fff;white-space:nowrap;overflow:hidden}
.s-tech{background:#3A6EA5} .s-news{background:#8A5BB0} .s-fin{background:#2F8C7E}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--muted);font-family:var(--f-num);font-size:10px}
.gridline{stroke:var(--line);stroke-width:1}

/* news */
.news{display:flex;flex-direction:column}
.news article{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.news article:last-child{border-bottom:0}
.news h4{margin:0;font-size:14px;font-weight:600}
.news p{color:var(--muted);font-size:13px;grid-column:1}
.news .meta{font-size:12px;color:var(--muted);grid-column:1}

/* forms */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:8px 10px;width:100%;min-width:0}
.field textarea{resize:vertical;min-height:64px}
.field .hint{font-size:11.5px;color:var(--muted)}
.frow{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px}
.toggle input{appearance:none;width:34px;height:20px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;transition:background .15s}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--surface);transition:transform .15s}
.toggle input:checked{background:var(--accent)}
.toggle input:checked::after{transform:translateX(14px)}

/* stat tiles */
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:22px;font-weight:600;margin-top:2px}
.stat .s{font-size:12px;margin-top:2px}

/* kanban */
.kan{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:4px}
.col{background:var(--surface-2);border-radius:var(--r-md);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col-h{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--muted);padding:2px 4px;text-transform:uppercase;letter-spacing:.05em}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.pc:hover{border-color:var(--accent)}
.pc.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right}

/* chat */
.chatwrap{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;min-height:560px}
.msgs{display:flex;flex-direction:column;gap:14px;padding:4px 0}
.msg{max-width:78%;padding:10px 14px;border-radius:14px;font-size:14px}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:4px}
.cite{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:1px 8px;margin:6px 4px 0 0;cursor:pointer;color:var(--accent)}
.suggest{display:flex;gap:8px;flex-wrap:wrap}
.suggest button{border:1px dashed var(--line);background:none;border-radius:99px;padding:5px 12px;cursor:pointer;font-size:12.5px}

/* confusion */
.cm{display:grid;grid-template-columns:auto repeat(3,1fr);gap:3px;font-size:12px}
.cm div{padding:10px 6px;text-align:center;border-radius:4px}
.cm .h{font-weight:600;color:var(--muted);background:none}

/* popovers / modal */
.pop{position:absolute;right:0;top:42px;width:340px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow);z-index:40;padding:8px}
.pop .it{display:flex;gap:10px;padding:10px;border-radius:var(--r-sm);cursor:pointer;font-size:13px}
.pop .it:hover{background:var(--surface-2)}
.pop .it.unread{font-weight:600}
.modal-bg{position:fixed;inset:0;background:rgba(10,18,15,.45);z-index:60;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:var(--r-md);max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;z-index:80;font-weight:500}

/* login */
.login{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.login-l{background:var(--accent);color:var(--accent-ink);padding:48px;display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.login-l h1{font-size:34px;max-width:16ch;line-height:1.15}
.login-r{display:grid;place-items:center;padding:32px 16px}
.login-form{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
.demo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.demo button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:10px;cursor:pointer}
.demo button b{display:block;font-size:13px}
.demo button span{font-size:11.5px;color:var(--muted)}

.empty403{text-align:center;padding:60px 16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty403 .code{font-family:var(--f-num);font-size:44px;font-weight:600;color:var(--muted)}

.bottombar{display:none}
.more-sheet{display:none}
.hide-sm{}

@media (max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-main{grid-template-columns:minmax(0,1fr)}
  .strip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .strip>div:nth-child(2){border-right:0}
  .strip>div:nth-child(-n+2){border-bottom:1px solid var(--line)}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .top{padding:10px 16px}
  .search{min-width:0;flex:1}
  .content{padding:16px 16px 96px}
  .g2,.g3,.fcs,.chatwrap{grid-template-columns:minmax(0,1fr)}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hide-sm{display:none!important}
  .chatlist{display:none}
  .msg{max-width:92%}
  .bottombar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .bottombar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);cursor:pointer;padding:4px 0}
  .bottombar button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7}

function candle(o,w=760,hgt=280){
  const r=rng(o.s), n=120; let p=o.px*(0.82+r()*0.3); const c=[];
  for(let i=0;i<n;i++){const drift=(o.px-p)/(n-i)*0.9;const op=p;const cl=Math.max(1,op+drift+(r()-.5)*o.px*0.028);const hi=Math.max(op,cl)*(1+r()*.012),lo=Math.min(op,cl)*(1-r()*.012);c.push({op,cl,hi,lo,news:r()<.07?(r()<.5?1:-1):0});p=cl}
  c[n-1].cl=o.px;
  const pad={l:8,r:52,t:10,b:34}, W=w-pad.l-pad.r, H=hgt-pad.t-pad.b;
  const mx=Math.max(...c.map(x=>x.hi)), mn=Math.min(...c.map(x=>x.lo));
  const y=v=>pad.t+(mx-v)/(mx-mn)*H, bw=W/n;
  let g='';
  const step=(mx-mn)/4;for(let i=0;i<=4;i++){const v=mn+step*i;g+=`<line class="gridline" x1="${pad.l}" x2="${pad.l+W}" y1="${y(v)}" y2="${y(v)}"/><text x="${pad.l+W+6}" y="${y(v)+3}">${fp(v/100)*100>0?fp(Math.round(v/50)*50):''}</text>`}
  const months=['05','06','07','08','09','10'];months.forEach((m,i)=>{const x=pad.l+(i*21+8)*bw;if(x<pad.l+W)g+=`<text x="${x}" y="${hgt-6}">T${m}</text>`});
  c.forEach((k,i)=>{const x=pad.l+i*bw+bw/2, col=k.cl>=k.op?'var(--up)':'var(--down)';
    g+=`<line x1="${x}" x2="${x}" y1="${y(k.hi)}" y2="${y(k.lo)}" stroke="${col}" stroke-width="1"/><rect x="${x-bw*.35}" y="${y(Math.max(k.op,k.cl))}" width="${bw*.7}" height="${Math.max(1,Math.abs(y(k.op)-y(k.cl)))}" fill="${col}"/>`;
    if(k.news)g+=`<circle cx="${x}" cy="${pad.t+H+12}" r="3.2" fill="${k.news>0?'var(--up)':'var(--down)'}"><title>Tin ${k.news>0?'tích cực':'tiêu cực'} mạnh</title></circle>`});
  g+=`<line x1="${pad.l}" x2="${pad.l+W}" y1="${y(o.px)}" y2="${y(o.px)}" stroke="var(--accent)" stroke-dasharray="3 3"/><rect x="${pad.l+W+2}" y="${y(o.px)-8}" width="48" height="16" rx="3" fill="var(--accent)"/><text x="${pad.l+W+6}" y="${y(o.px)+4}" style="fill:var(--accent-ink);font-weight:600">${fp(o.px)}</text>`;
  return `<svg viewBox="0 0 ${w} ${hgt}" role="img" aria-label="Biểu đồ nến 6 tháng ${o.s}">${g}</svg>`;
}
function lineChart(vals,{w=760,h=200,color='var(--accent)',area=true,zero=false,fmt=v=>v,labels=[]}={}){
  const pad={l:8,r:56,t:10,b:24},W=w-pad.l-pad.r,H=h-pad.t-pad.b;
  const mx=Math.max(...vals),mn=zero?Math.min(0,...vals):Math.min(...vals);const rg=mx-mn||1;
  const x=i=>pad.l+i/(vals.length-1)*W,y=v=>pad.t+(mx-v)/rg*H;
  let g='';for(let i=0;i<=3;i++){const v=mn+rg*i/3;g+=`<line class="gridline" x1="${pad.l}" x2="${pad.l+W}" y1="${y(v)}" y2="${y(v)}"/><text x="${pad.l+W+6}" y="${y(v)+3}">${fmt(v)}</text>`}
  labels.forEach(([i,t])=>g+=`<text x="${x(i)}" y="${h-6}" text-anchor="middle">${t}</text>`);
  const d=vals.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  if(area)g+=`<path d="${d}L${x(vals.length-1)},${pad.t+H}L${pad.l},${pad.t+H}Z" fill="${color}" opacity=".12"/>`;
  g+=`<path d="${d}" fill="none" stroke="${color}" stroke-width="2"/><circle cx="${x(vals.length-1)}" cy="${y(vals.at(-1))}" r="4" fill="${color}"/>`;
  return `<svg viewBox="0 0 ${w} ${h}">${g}</svg>`;
}
function sentChart(o){
  const r=rng(o.s+'s'),n=30,w=760,h=200,pad={l:8,r:56,t:10,b:24},W=w-pad.l-pad.r,H=h-pad.t-pad.b;

  const bw=W/n,mid=pad.t+H/2,sy=v=>mid-v/1*H/2*0.9;
  const pmx=Math.max(...pv),pmn=Math.min(...pv),py=v=>pad.t+(pmx-v)/(pmx-pmn)*H;
  let g=`<line class="gridline" x1="${pad.l}" x2="${pad.l+W}" y1="${mid}" y2="${mid}"/><text x="${pad.l+W+6}" y="${pad.t+8}">+1</text><text x="${pad.l+W+6}" y="${mid+3}">0</text><text x="${pad.l+W+6}" y="${pad.t+H}">−1</text>`;
  sv.forEach((v,i)=>{const x=pad.l+i*bw+bw*.15;g+=`<rect x="${x}" y="${Math.min(mid,sy(v))}" width="${bw*.7}" height="${Math.abs(sy(v)-mid)}" fill="${v>=0?'var(--up)':'var(--down)'}" opacity=".75"/>`});

  g+=`<path d="${d}" fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-dasharray="4 3"/>`;

}

function reasons(o){

    down:['Giá cắt xuống dưới MA20, RSI(14) giảm từ 58 về 41 trong 6 phiên.','Tin tiêu cực chiếm 4/6 bài trong 3 ngày qua (chỉ số cảm xúc −0,37).','P/E hiện tại cao hơn trung vị ngành 18%, mức định giá kém hấp dẫn hơn.']}[L];

  if(o.conflict)risk.unshift('T+2 và T+5 ngược chiều nhau: tín hiệu ngắn hạn chưa ổn định, mức tin cậy đã được hạ một bậc.');

}

/* ============ định tuyến theo hash ============
   Mỗi màn hình có một địa chỉ riêng dạng neo đơn giản, chỉ gồm chữ, số và dấu gạch ngang
   (nền tảng artifact chỉ chuyển loại neo này vào trang):
   #<trang>-<vai trò>[-<tham số>...]   ví dụ  #watchlist-trader   #detail-analyst-fpt-an   #admin-admin-jobs
   Trang: overview detail screener watchlist portfolio plans journal chat eval admin settings, và login
   Vai trò: retail trader analyst admin (bỏ trống thì lấy vai trò đầu tiên được phép vào trang)
   Tham số: mã cổ phiếu (fpt, hpg...), tab chi tiết (fc news hist an), lọc tin (pos neu neg), kỳ hạn t2 t5,
   cửa sổ w30 w90, kế hoạch p9, nhật ký j1, bộ lọc screener s0..s3, tab quản trị (users jobs models audit notif chatlog),
   anno để bật chú thích FR */
function hashOf(){
  if(st.screen==='login')return '#login';
  const p=[st.page,st.role];
  if(st.page==='detail'){
    p.push(st.sym.toLowerCase(),st.tab);
    if(st.tab==='hist')p.push('t'+(st.histH||2),'w'+st.hist);
    if(st.tab==='news'&&st.newsF!=='all')p.push(st.newsF);
  }
  else if(st.page==='admin')p.push(st.adminTab);
  else if(st.page==='eval')p.push('t'+st.evalH);
  else if(st.page==='plans')p.push('p'+st.planSel);
  else if(st.page==='journal')p.push('j'+st.jSel);
  else if(st.page==='screener')p.push('s'+(st.preset||0));
  if(st.annos)p.push('anno');
  return '#'+p.join('-');
}
function applyHash(){
  const raw=(location.hash||'').replace(/^#\/?/,'').toLowerCase();
  if(!raw)return false;
  const parts=raw.split('-'),id=parts[0],rest=parts.slice(1);
  if(id==='login'){st.screen='login';st.bell=false;st.more=false;return true}
  const pg=PAGES.find(p=>p[0]===id);
  if(!pg)return false;
  st.screen='app';st.page=id;st.bell=false;st.more=false;
  st.role=rest.find(x=>ROLE_N[x])||pg[4][0];
  /* tham số không có trong địa chỉ thì quay về mặc định, để cùng một địa chỉ luôn cho cùng một màn hình */
  st.tab='fc';st.newsF='all';st.histH=2;st.hist=30;st.evalH=2;st.planSel=2;st.jSel=1;st.preset=0;st.adminTab='users';
  for(const x of rest){
    if(ROLE_N[x])continue;
    const up=x.toUpperCase();
    if(BY[up])st.sym=up;
    else if(['fc','news','hist','an'].includes(x))st.tab=x;
    else if(['pos','neu','neg'].includes(x))st.newsF=x;
    else if(/^t[25]$/.test(x)){if(id==='eval')st.evalH=+x[1];else st.histH=+x[1]}
    else if(/^w(30|90)$/.test(x))st.hist=+x.slice(1);
    else if(/^p\d+$/.test(x))st.planSel=+x.slice(1);
    else if(/^j\d+$/.test(x))st.jSel=+x.slice(1);
    else if(/^s[0-3]$/.test(x))st.preset=+x[1];
    else if(x==='anno')st.annos=true;
    else if(id==='admin')st.adminTab=x;
  }
  return true;
}
function syncHash(){
  try{const h=hashOf();if(location.hash!==h)history.replaceState(null,'',h)}catch(e){}
}

  document.addEventListener('submit',e=>{if(e.target.id==='loginf'){e.preventDefault();e.stopImmediatePropagation();const email=document.getElementById('lg-e').value.toLowerCase(),pw=document.getElementById('lg-p').value;let msg='';if(userLocked){msg='Tài khoản đã bị khóa. Liên hệ quản trị viên.'}else if(Date.now()<lockedUntil){msg='Đăng nhập tạm khóa 15 phút. Vui lòng thử lại sau.'}else if(!email||!pw||pw==='wrong'||pw==='sai'){attempts++;msg='Email hoặc mật khẩu không đúng.';if(attempts>=5)lockedUntil=Date.now()+15*60*1000}else{attempts=0;st.screen='app';st.page=st.role==='admin'?'admin':'overview';render()}let old=document.getElementById('login-error');if(msg){if(!old){old=document.createElement('div');old.id='login-error';old.className='note warn';e.target.querySelector('h1').after(old)}old.textContent=msg}}},true);
  const login=pLogin;pLogin=function(){return login().replace('</form>','<button type="button" class="btn" data-extra="forgot">Quên mật khẩu?</button><div class="small muted">Tài khoản khóa do quản trị viên sẽ không thể đăng nhập.</div></form>')};
  document.addEventListener('click',e=>{const x=e.target.closest('[data-extra="forgot"]');if(x){e.preventDefault();modal('<h2>Quên mật khẩu</h2><p>Nhập email để nhận hướng dẫn đặt lại mật khẩu.</p><input type="email" placeholder="ban@example.com"><button class="btn pri" data-extra="send-reset">Gửi hướng dẫn</button> <button class="btn" data-act="cm">Hủy</button>')}if(e.target.closest('[data-extra="send-reset"]')){closeModal();toastSafe('Nếu email tồn tại, hướng dẫn đặt lại đã được gửi')}},true);
  const originalInit=render;originalInit();
})();
</script></body></html>
